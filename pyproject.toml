[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synaptic-tomo-tools"
version = "0.1.0"
description = "A Python toolkit for analyzing synaptic cryo-electron tomography (cryo-ET) data"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
dependencies = [
    # Core scientific libraries
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "pulp>=2.6",
    "networkx>=2.6",
    "einops>=0.6",
    "requests>=2.25",
    # 3D mesh processing
    "trimesh>=3.9",
    # File and data handling
    "starfile>=0.1.3",
    "mrcfile>=1.4",
    # Plotting and visualization
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "aquarel",
    "reportlab",
    "pillow",
    "PyPDF2",
    # Progress / system
    "tqdm>=4.62",
    "psutil>=5.8",
    # Image processing and computer vision
    "scikit-image>=0.19",
    "scikit-learn",
    "opencv-python>=4.5",
    "imageio>=2.9",
    # Deep learning / transforms
    "torch>=1.9",
    "segment-anything>=1.0",
    "torch-transform-image",
    "torch-affine-utils",
    # Geodesic Ripley's O
    "membrain-stats>=0.0.3",
    "potpourri3d",
    # Utilities (zonogram viewer)
    "streamlit>=1.28",
    # Preprocessing pipeline (FindingAMPA)
    "findingampa @ git+https://github.com/jojoelfe/findingampa.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/catler4/SynapticTomoTools"
Repository = "https://github.com/catler4/SynapticTomoTools"

[project.scripts]
synaptic-tomo-tools = "synaptic_tomo_tools.cli:main"
synaptic-tomo-poses = "synaptic_tomo_tools.poses:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"